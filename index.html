<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form class="pokemonForm">
        <div class="search-bar">
            <input type="text" placeholder="Enter Pokémon name..." id="myInput">
            <button type="submit">🔍</button>
        </div>
    </form>

    <div class="card">

        <div class="upperImg">
            <img id="pokemonSprite" style="display:none" alt="Pokemon Sprite">
            <p id="pokemonName">Search a Pokémon</p>
            <p id="idDisplay"></p>
            <p id="typeDisplay"></p>
        </div>

        <div class="details">
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
